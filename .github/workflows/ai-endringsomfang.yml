name: AI endringsomfang
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  omfang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontroller deklarerte filer
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/ai-endringsomfang.cjs
