name: ChatGPT-integrasjon – PHP-kontroll
on:
  pull_request:
    paths:
      - 'api/admin/kursbilde-kontrollert.php'
      - '.github/workflows/chatgpt-integrasjon.yml'
permissions:
  contents: read
jobs:
  php-syntaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Sjekk PHP-syntaks
        run: php -l api/admin/kursbilde-kontrollert.php
