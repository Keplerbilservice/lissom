name: Legg ut testsiden (test.lissom.no)

# Grenen «test» legges ut paa test.lissom.no — en kopi av nettsiden mot en
# kopi av databasen, der moduler kan proeves mot ekte data foer de merges til
# main. Mappene ligger utenfor public_html, i ~/test-site/:
#
#   ~/test-site/public/          dokumentrota til test.lissom.no
#   ~/test-site/lissom-app/      backend, cron og migrasjoner
#   ~/test-site/lissom-secrets/  secrets.php med miljo => test og lissom_test
#
# api/_boot.php leter oppover etter naermeste lissom-app/, saa testen finner
# sin egen backend foer den finner produksjonens. Med miljo => test sender
# Varsler ingen e-post eller SMS, og side.php legger «TEST»-merkelappen paa.
#
# Samme FTP-konto som produksjon; stiene er det eneste som skiller dem.
on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: publiser-test
  cancel-in-progress: false

jobs:
  publiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sjekk PHP-syntaks før noe legges ut
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          find api app bin -name '*.php' -print0 | xargs -0 -n1 php -l
          # side.php ligger i rota og serverer hver eneste side. En
          # syntaksfeil der er hele nettsida nede — den sjekkes ogsaa.
          php -l side.php

      # 1) Nettsiden: alt som skal være offentlig tilgjengelig.
      - name: Legg ut nettsiden
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./
          server-dir: test-site/public/
          exclude: |
            **/.git*
            **/.git*/**
            app/**
            bin/**
            db/**
            docs/**
            tests/**
            .github/**
            *.md
            **/.DS_Store

      # 2) Koden som IKKE skal være offentlig. Legges utenfor public_html, der
      #    ingen kan laste den ned ved å gjette adressen.
      - name: Legg ut backend-koden
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: test-site/lissom-app/app/
          exclude: |
            **/secrets.php
            **/.DS_Store

      - name: Legg ut cron-skript og migrasjoner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./bin/
          server-dir: test-site/lissom-app/bin/

      - name: Legg ut databasemigrasjoner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./db/migrations/
          server-dir: test-site/lissom-app/migrations/

      # Dokumentene til kortene i verkstedet (håndbøkene og keramikkmalene).
      # Ligger utenfor public_html som resten av app-koden: filene serveres
      # av api/dokument.php, som sjekker hvem som spør. «⚙ Kjør
      # oppdateringer» i admin kopierer dem inn i kortene — se
      # Dokumenter::importer(). Pakka lages av bin/dokumentpakke.mjs.
      - name: Legg ut dokumentene til verkstedet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./db/dokumenter/
          server-dir: test-site/lissom-app/dokumenter-import/
