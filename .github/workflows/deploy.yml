name: Publiser til lissom.no

# Hver push til main oppdaterer nettsiden automatisk. Du fortsetter altså å
# laste opp filer på github.com akkurat som før — resten skjer av seg selv.
#
# Nettsiden ligger på lissom.no, i public_html.
#
# Fram til august 2026 lå den i en undermappe av public_html, mens en gammel
# WordPress hadde public_html. cPanel lot oss ikke endre dokumentroten på
# hovedområdet, så filene ble flyttet opp i stedet: WordPress ligger nå i
# ~/gammel-wordpress, utenfor det som publiseres.
#
# Endres denne stien, må filene flyttes samtidig. Peker den ett sted mens
# nettsiden ligger et annet, går publiseringen grønt uten at noe endrer seg —
# og det er en vond feil å lete etter.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publiser
  cancel-in-progress: false

jobs:
  # Testsperren (eieren 27.09.2026, avgrenset 02.11.2026 etter regelen fra
  # 03.10.2026: «Aldri hele testpakken automatisk … Kjør bare kontroller som er
  # relevante for endrede filer»). «velg» finner testene som hører til filene i
  # pushen (tests/kobling.tsv), «kontroll» kjører dem, og er én rød, legges
  # ingenting ut. Hele pakken (tester.yml) kjøres bare når en endret kodefil
  # ikke har noen kobling.
  velg:
    runs-on: ubuntu-latest
    outputs:
      kommandoer: ${{ steps.v.outputs.kommandoer }}
      filer: ${{ steps.v.outputs.filer }}
      alle: ${{ steps.v.outputs.alle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finn testene som hører til de endrede filene
        id: v
        env:
          KONTROLL_BASE: ${{ github.event.before }}
        run: bash bin/kontroll-endret.sh velg "$KONTROLL_BASE"

  kontroll:
    needs: velg
    if: ${{ needs.velg.outputs.kommandoer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: lissom_test
          MARIADB_USER: lissom
          MARIADB_PASSWORD: lissom
          MARIADB_ROOT_PASSWORD: rot
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, gd, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Samme testoppsett og database som tester.yml.
      - name: Sett opp testoppsett og database
        run: |
          php -r '
            $s = require "app/secrets.example.php";
            $s["miljo"] = "test";
            $s["db_vert"] = "127.0.0.1";
            $s["db_navn"] = "lissom_test";
            $s["db_bruker"] = "lissom";
            $s["db_passord"] = "lissom";
            foreach (["vipps_msn", "vipps_client_id", "vipps_client_secret", "vipps_sub_key"] as $n) { $s[$n] = "test"; }
            $s["cron_nokkel"] = "test";
            $s["admin_telefoner"] = ["+4791234567"];
            file_put_contents("app/secrets.php", "<?php return " . var_export($s, true) . ";");
          '
          mkdir -p /tmp/senere
          for f in db/migrations/*.sql; do
            [[ "$(basename "$f")" > "128" ]] && mv "$f" /tmp/senere/
          done
          php bin/migrate.php
          mysql -h 127.0.0.1 -u lissom -plissom lissom_test -e "UPDATE membership_plans SET navn = 'Basis 30' WHERE navn = '30 timer'"
          mv /tmp/senere/*.sql db/migrations/
          php bin/migrate.php

      - name: Kjør de koblede testene
        env:
          KOMMANDOER: ${{ needs.velg.outputs.kommandoer }}
          VEDTAK_FILER: ${{ needs.velg.outputs.filer }}
        run: bash bin/kontroll-endret.sh kjor

  full:
    needs: velg
    if: ${{ needs.velg.outputs.alle == 'true' }}
    uses: ./.github/workflows/tester.yml

  # Syntaks i endrede PHP-filer må være gyldig før utlegging.
  publiser:
    needs: [velg, kontroll, full]
    if: ${{ always() && needs.velg.result == 'success' && (needs.kontroll.result == 'success' || needs.kontroll.result == 'skipped') && (needs.full.result == 'success' || needs.full.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sjekk PHP-syntaks i endrede filer før noe legges ut
        env:
          KONTROLL_BASE: ${{ github.event.before }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          base="$KONTROLL_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.php' |
            while IFS= read -r -d '' fil; do php -l "$fil"; done

      # 1) Nettsiden: alt som skal være offentlig tilgjengelig.
      - name: Legg ut nettsiden
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            app/**
            bin/**
            db/**
            docs/**
            tests/**
            .github/**
            *.md
            **/.DS_Store

      # 2) Koden som IKKE skal være offentlig. Legges utenfor public_html, der
      #    ingen kan laste den ned ved å gjette adressen.
      - name: Legg ut backend-koden
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: lissom-app/app/
          exclude: |
            **/secrets.php
            **/.DS_Store

      - name: Legg ut cron-skript og migrasjoner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./bin/
          server-dir: lissom-app/bin/

      - name: Legg ut databasemigrasjoner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./db/migrations/
          server-dir: lissom-app/migrations/

      # Dokumentene til kortene i verkstedet (håndbøkene og keramikkmalene).
      # Ligger utenfor public_html som resten av app-koden: filene serveres
      # av api/dokument.php, som sjekker hvem som spør. «⚙ Kjør
      # oppdateringer» i admin kopierer dem inn i kortene — se
      # Dokumenter::importer(). Pakka lages av bin/dokumentpakke.mjs.
      - name: Legg ut dokumentene til verkstedet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUKER }}
          password: ${{ secrets.FTP_PASSORD }}
          protocol: ftps
          local-dir: ./db/dokumenter/
          server-dir: lissom-app/dokumenter-import/
