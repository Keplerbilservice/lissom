name: Tester

# Kjorer alle testene mot en tom database. Brukes av «Publiser til lissom.no»
# som sperre: feiler noe her, legges ingenting ut. Kjores ogsaa paa hver
# gren som ikke er main, saa en endring kan provest foer den slaas sammen.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  # Eieren, 2. oktober 2026: testene tok ~30 min i én jobb. Naa deles de i
  # grupper (tests/alle.sh, «gruppe»-linjene) som kjorer parallelt, hver med
  # egen base. «plan» leser gruppelisten fra alle.sh og feiler hvis et
  # testsett staar uten gruppe — saa ingen test kan falle ut av sperren.
  # Publiseringen venter paa hele workflowen: faller en gruppe, legges ingenting ut.
  plan:
    runs-on: ubuntu-latest
    outputs:
      grupper: ${{ steps.g.outputs.grupper }}
    steps:
      - uses: actions/checkout@v4
      - name: Finn gruppene og sjekk at alle testsett har en
        id: g
        run: |
          ALLE_TORR=1 bash tests/alle.sh | tee /tmp/torr.txt
          # Hver gruppe maa ha minst ett testsett.
          for g in $(bash tests/alle.sh --grupper); do
            grep -q "^$g"$'\t' /tmp/torr.txt || { echo "Gruppen $g er tom"; exit 1; }
          done
          echo "grupper=$(bash tests/alle.sh --grupper | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  tester:
    needs: plan
    name: tester (${{ matrix.gruppe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gruppe: ${{ fromJSON(needs.plan.outputs.grupper) }}
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: lissom_test
          MARIADB_USER: lissom
          MARIADB_PASSWORD: lissom
          MARIADB_ROOT_PASSWORD: rot
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, gd, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nettleseren (~150 MB) hentes bare naar hurtigbufferen mangler.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: tester-npm-pw-${{ runner.os }}-${{ hashFiles('.github/workflows/tester.yml') }}
          restore-keys: tester-npm-pw-${{ runner.os }}-

      - name: Sett opp testoppsett og database
        run: |
          php -r '
            $s = require "app/secrets.example.php";
            $s["miljo"] = "test";
            $s["db_vert"] = "127.0.0.1";
            $s["db_navn"] = "lissom_test";
            $s["db_bruker"] = "lissom";
            $s["db_passord"] = "lissom";
            // Testverdier. Vipps er en stubbe i testene, aldri den ekte.
            foreach (["vipps_msn", "vipps_client_id", "vipps_client_secret", "vipps_sub_key"] as $n) { $s[$n] = "test"; }
            $s["cron_nokkel"] = "test";
            // Nummeret testmedlemmet logger inn med, som noedluke til admin.
            $s["admin_telefoner"] = ["+4791234567"];
            file_put_contents("app/secrets.php", "<?php return " . var_export($s, true) . ";");
          '
          # Verkstedet doepte «30 timer» om til «Basis 30» i admin, ikke i en
          # migrasjon — foer 128, som skriver teksten ved det nye navnet. Gjor
          # det samme her: migrasjonene fram til 128, omdoepingen, resten.
          mkdir -p /tmp/senere
          for f in db/migrations/*.sql; do
            [[ "$(basename "$f")" > "128" ]] && mv "$f" /tmp/senere/
          done
          php bin/migrate.php
          mysql -h 127.0.0.1 -u lissom -plissom lissom_test -e "UPDATE membership_plans SET navn = 'Basis 30' WHERE navn = '30 timer'"
          mv /tmp/senere/*.sql db/migrations/
          php bin/migrate.php
          # Sjekkene av nettsida bruker terser, som ellers bare ligger lokalt.
          npm install --no-save --no-package-lock terser playwright
          # Nettlesertestene (tests/nettleser) klikker seg gjennom i Chromium.
          npx playwright install --with-deps chromium

      # Eieren, 27. september 2026: «jeg får eposter fra github hele tiden». Hver
      # rød kjøring på en arbeidsgren ga en e-post til kontoen hans. Paa
      # grenene leses resultatet av den som jobber («Gikk/Feilet» i loggen),
      # saa der stopper ikke en feil kjoringen. Foer publisering (workflow_call
      # fra «Publiser til lissom.no») stopper den som foer — og varsler.
      - name: Kjor testene i gruppen ${{ matrix.gruppe }}
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        env:
          ALLE_GRUPPE: ${{ matrix.gruppe }}
        run: |
          php tests/nettleser/testdatabase-test.php
          bash tests/alle.sh
