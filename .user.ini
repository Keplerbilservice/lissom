; Lissom — hvor stor en opplasting faar vaere.
;
; Eieren, 10. september 2026, om dokumentkortene: kan taket heves «saa langt
; serveren tillater»?
;
; PHP har to tak, og det laveste vinner:
;
;   upload_max_filesize   selve fila
;   post_max_size         hele forespoerselen — fila pluss feltene rundt
;
; Staar post_max_size lavest, kommer en for stor forespoersel fram HELT TOM:
; ingen $_POST, ingen $_FILES, og ingen feilkode. Derfor ligger den hoyest av
; de to her, med rom til feltene.
;
; Standarden hos de fleste er 2 MB — altsaa mindre enn ett skannet ark i god
; oppl0sning. En glasurhaandbok med bilder er fort 30.
;
; Merk: denne fila leses av PHP-FPM og PHP-CGI, som er det Domene.no kjorer.
; Kjorer serveren mod_php i stedet, er det blokka i .htaccess som gjelder —
; de to sier det samme med vilje.
;
; Koden leser av det som faktisk gjelder, se Dokumenter::maksBytes(). Blir
; denne fila ignorert av webhotellet, sier skjermen det virkelige tallet og
; ikke et vi har skrevet av her.

upload_max_filesize = 64M
post_max_size = 66M
