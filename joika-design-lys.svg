<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 138" role="img" aria-labelledby="jdTittel">
  <title id="jdTittel">Joika Design</title>
  <!--
    Firevindslua som strektegning bak navnet.

    Spissene har svaert ulik lengde og lener utover. Fire like tagger paa en
    rett strek ble prøvd, og ble en krone hver gang — det er skjevheten som
    gjor lua til en lue.

    Gradienten tynnes kraftig ut nedover. Der navnet staar er streken nesten
    borte, saa lua ligger bak uten aa slaass med teksten. Toppen av spissene
    baerer merket.

    #F4EBDE hele veien, saa merket folger fargen paa teksten rundt seg.
    Det forutsetter at svg-en ligger inne i sida — en <img> er sitt eget
    dokument og arver ingen farge utenfra.
  -->
  <defs>
    <linearGradient id="jdToning" gradientUnits="userSpaceOnUse" x1="160" y1="4" x2="160" y2="124">
      <stop offset="0"   stop-color="#F4EBDE" stop-opacity=".82"/>
      <stop offset=".38" stop-color="#F4EBDE" stop-opacity=".40"/>
      <stop offset=".62" stop-color="#F4EBDE" stop-opacity=".13"/>
      <stop offset="1"   stop-color="#F4EBDE" stop-opacity=".06"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#jdToning)" stroke-linejoin="round" stroke-linecap="round">
    <path stroke-width="3.2" d="M74 104 L54 46 L110 82 L97 14 L150 70 L204 4 L226 104"/>
    <rect x="70" y="102" width="160" height="22" rx="11" stroke-width="3.2"/>
  </g>

  <text x="145" y="96" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="35" font-weight="700" letter-spacing="0.4"
        fill="#F4EBDE">Joika Design</text>
</svg>
