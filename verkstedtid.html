<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkstedtid · Lissom</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#3c3029;font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 80px}a{color:#98583d}h1,h2{font-family:Georgia,serif}h1{font-size:32px;margin:24px 0 5px}h2{font-size:22px;margin:0 0 8px}.muted{color:#73665d}.card{background:#fffdf9;border:1px solid #e7ddd3;border-radius:12px;padding:20px;margin:18px 0}.row{border-top:1px solid #e7ddd3;padding:12px 0}.row:first-child{border:0}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{width:100%;padding:10px;border:1px solid #bfb0a3;border-radius:7px;background:white;color:#3c3029;font:inherit}textarea{min-height:82px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:1px solid #a65f43;background:#a65f43;color:white;border-radius:7px;padding:11px 16px;font:600 15px system-ui,sans-serif;margin-top:18px}.error{color:#9d2f27}.status{background:#f4e5da;border-radius:7px;padding:9px 12px}button:disabled{opacity:.6}@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="/min-side">← Til Min side</a><h1>Verkstedtid</h1><p class="muted">Se øktene dine og meld fra om en tid som er feil. Timene endres først når verkstedet har kontrollert forslaget.</p>
<section class="card"><h2>Øktene dine</h2><div id="okter">Henter …</div></section>
<section class="card"><h2>Meld feil tid</h2><form id="forslag"><label for="okt">Hvilken økt?</label><select id="okt" required><option value="">Velg økt</option></select><div class="grid"><div><label for="dato">Dato</label><input id="dato" type="date" required></div><div><label for="inn">Riktig inn</label><input id="inn" type="text" inputmode="numeric" maxlength="5" placeholder="11:00" required></div><div><label for="ut">Riktig ut</label><input id="ut" type="text" inputmode="numeric" maxlength="5" placeholder="16:00" required></div></div><label for="forklaring">Hva ble feil?</label><textarea id="forklaring" minlength="5" maxlength="1000" required placeholder="For eksempel: Jeg glemte å stemple ut da jeg gikk."></textarea><button class="btn" type="submit">Send forslag</button><p id="melding" role="status"></p></form></section>
<section class="card"><h2>Forslag du har sendt</h2><div id="saker">Henter …</div></section></main>
<script>
const $=id=>document.getElementById(id);const stat={apen:'Venter på svar',trenger_info:'Verkstedet trenger flere opplysninger',rettet:'Rettet',avslaatt:'Avslått'};let egneOkter=[];
async function kall(data){const r=await fetch('/api/stempling-rett.php',{credentials:'same-origin',cache:'no-store',...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.feil||'Kunne ikke hente verkstedtid.');return d}
function node(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
function valg(x){delete $('forslag').dataset.sakId;$('okt').value=String(x.id);$('dato').value=x.inn.slice(0,10);$('inn').value=x.inn.slice(11,16);$('ut').value=x.ut?.slice(11,16)||'';$('forslag').scrollIntoView({behavior:'smooth'})}
async function last(){try{const d=await kall();egneOkter=d.okter;const list=$('okter'),sel=$('okt'),saker=$('saker');list.replaceChildren();sel.replaceChildren(new Option('Velg økt',''),new Option('En økt mangler helt','0'));
for(const x of d.okter){const row=node('div','', 'row');row.append(node('strong',x.inn.slice(0,10)+' · '+x.inn.slice(11,16)+'–'+(x.ut?.slice(11,16)||'pågår')));row.append(node('div',x.ut===null?'Økten er fortsatt åpen':x.minutter+' minutter telt','muted'));if(x.ut!==null){const b=node('button','Meld feil på denne økten','btn');b.type='button';b.onclick=()=>valg(x);row.append(b);sel.add(new Option(x.inn.replace(' ',' · '),String(x.id)))}list.append(row)}if(!d.okter.length)list.textContent='Ingen verkstedøkter registrert ennå.';
saker.replaceChildren();for(const x of d.saker){const row=node('div','', 'row');row.append(node('strong',(stat[x.status]||x.status)+' · '+x.inn+'–'+x.ut.slice(11,16)));if(x.status==='rettet'&&x.endeligInn&&x.endeligUt)row.append(node('div','Endelig registrert: '+x.endeligInn+'–'+x.endeligUt.slice(11,16)));row.append(node('div',x.forklaring,'muted'));if(x.adminNotat)row.append(node('div','Fra verkstedet: '+x.adminNotat));if(x.status==='trenger_info'){const b=node('button','Oppdater forslaget','btn');b.type='button';b.onclick=()=>{$('okt').value=String(x.oktId||0);$('dato').value=x.inn.slice(0,10);$('inn').value=x.inn.slice(11,16);$('ut').value=x.ut.slice(11,16);$('forklaring').value=x.forklaring;$('forslag').dataset.sakId=String(x.id);$('forslag').scrollIntoView({behavior:'smooth'})};row.append(b)}saker.append(row)}if(!d.saker.length)saker.textContent='Ingen forslag sendt.'
}catch(e){$('okter').textContent=e.message;$('saker').textContent='';}}
$('okt').onchange=()=>{delete $('forslag').dataset.sakId;const x=egneOkter.find(o=>String(o.id)===$('okt').value);if(x){$('dato').value=x.inn.slice(0,10);$('inn').value=x.inn.slice(11,16);$('ut').value=x.ut?.slice(11,16)||''}else{$('dato').value='';$('inn').value='';$('ut').value=''}};
$('forslag').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;const msg=$('melding');msg.className='';try{const d=await kall({sakId:Number(e.target.dataset.sakId||0),oktId:Number($('okt').value),dato:$('dato').value,inn:$('inn').value,ut:$('ut').value,forklaring:$('forklaring').value});msg.textContent=d.beskjed;e.target.reset();delete e.target.dataset.sakId;await last()}catch(err){msg.textContent=err.message;msg.className='error'}finally{b.disabled=false}};last();
</script></body></html>
